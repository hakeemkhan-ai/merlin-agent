[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "merlin-agent"
version = "0.1.0"
description = "A durable terminal coding agent with isolated remote workspaces"
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
  "alembic>=1.14,<2", "e2b>=2.58,<3", "fastapi>=0.115,<1", "google-genai>=2.8,<3",
  "httpx>=0.28", "opentelemetry-api>=1.29", "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp-proto-http>=1.29", "prometheus-client>=0.21",
  "prompt-toolkit>=3.0", "psycopg[binary]>=3.2", "pydantic-settings>=2.7",
  "pyjwt[crypto]>=2.10", "rich>=13.9", "sqlalchemy>=2.0,<3", "typer>=0.15",
  "uvicorn>=0.34", "textual>=8.2.8,<9",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
merlin = "merlin.cli:app"
merlin-worker = "merlin.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"merlin.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires explicitly configured remote services", "postgres: requires a PostgreSQL test database"]
addopts = "-m 'not live and not postgres'"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
