<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Merlin evaluation</title></head>
<body><h1>Merlin fixture</h1><button id="increment">Increment</button><p id="count">Count: 0</p>
<script>let count = 0; document.querySelector('#increment').onclick = () => {
  document.querySelector('#count').textContent = `Count: ${++count}`;
};</script></body></html>
